        input_schema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
      list_channels:
        method: GET
        path: /teams/{team_id}/channels
        description: Listar canales del equipo.
        effect: read
        input_schema:
          type: object
          properties:
            team_id: *id002
          required:
          - team_id
          additionalProperties: false
      list_messages:
        method: GET
        path: /teams/{team_id}/channels/{channel_id}/messages
        description: Leer mensajes de canal permitidos.
