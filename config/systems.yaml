              type: string
              maxLength: 998
            text:
              type: string
              maxLength: 100000
          required:
          - from_email
          - to_email
          - subject
          - text
          additionalProperties: false
        body_template:
          personalizations:
          - to:
            - email: '@to_email'
          from:
            email: '@from_email'
          subject: '@subject'
          content:
          - type: text/plain
            value: '@text'
  resend:
