        input_schema:
          type: object
          properties:
            team_id: *id002
            channel_id: *id002
            content:
              type: string
              maxLength: 10000
          required:
          - team_id
          - channel_id
          - content
          additionalProperties: false
        body_template:
          body:
            contentType: text
            content: '@content'
  github:
    protocol: provider
    provider: github
    enabled: false
    description: 'GitHub REST: repositorios y tickets.'
    base_url: https://api.github.com
    allowed_hosts:
    - api.github.com
    auth:
      type: bearer
      token_env: GITHUB_TOKEN
      prefix: Bearer
    sensitive: true
    operations:
      get_repo:
        method: GET
        path: /repos/{owner}/{repo}
        description: Consultar metadata del repositorio.
        effect: read
        input_schema:
          type: object
          properties:
            owner: *id002
            repo: *id002
          required:
          - owner
          - repo
          additionalProperties: false
      list_issues:
        method: GET
        path: /repos/{owner}/{repo}/issues
        description: Listar issues y paginar.
        effect: read
        input_schema:
          type: object
          properties:
            owner: *id002
            repo: *id002
            state:
              enum:
              - open
              - closed
              - all
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 100
          required:
          - owner
          - repo
          additionalProperties: false
      create_issue:
        method: POST
        path: /repos/{owner}/{repo}/issues
        description: Crear ticket con autorización explícita.
        effect: write
        input_schema:
          type: object
          properties:
            owner: *id002
            repo: *id002
            title:
              type: string
              maxLength: 256
