      - Channel.ReadBasic.All
      - ChannelMessage.Read.All
      - ChannelMessage.Send
    sensitive: true
    operations:
      joined_teams:
        method: GET
        path: /me/joinedTeams
        description: Listar equipos del usuario autorizado.
