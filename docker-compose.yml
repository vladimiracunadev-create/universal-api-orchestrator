services:
  api:
    build: .
    env_file: .env
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
