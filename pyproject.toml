[project]
name = "universal-api-orchestrator"
version = "0.3.0"
description = "Gateway multicanal: protocolos, conectores, OAuth, eventos y respuestas con fuentes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Acuña"}]
keywords = ["api-gateway", "orchestration", "oauth", "webhooks", "fastapi", "integration"]
classifiers = [
 "Development Status :: 4 - Beta",
 "Framework :: FastAPI",
 "Intended Audience :: Developers",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Topic :: Communications",
 "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1",
 "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7",
 "jmespath>=1,<2", "jsonschema>=4.23,<5", "cryptography>=50,<51",
 "python-dotenv>=1,<2", "defusedxml>=0.7,<1"
]

[project.urls]
Homepage = "https://github.com/vladimiracunadev-create/universal-api-orchestrator"
Documentation = "https://github.com/vladimiracunadev-create/universal-api-orchestrator/blob/main/docs/README.md"
Changelog = "https://github.com/vladimiracunadev-create/universal-api-orchestrator/blob/main/CHANGELOG.md"
Issues = "https://github.com/vladimiracunadev-create/universal-api-orchestrator/issues"

[project.optional-dependencies]
auth = ["google-auth-oauthlib>=1.2,<2", "msal>=1.30,<2"]
grpc = ["grpcio>=1.66,<2", "protobuf>=5.27,<8"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1", "pytest-cov>=5,<8"]

[project.scripts]
uao = "universal_api_orchestrator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
